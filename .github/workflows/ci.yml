name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validar, testar e construir
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obter código
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Verificar sintaxe
        run: npm run check
      - name: Testar formulário e persistência
        run: npm test
      - name: Construir Worker
        run: npm run build
      - name: Verificar Worker compilado
        run: npm run check:build
      - name: Disponibilizar build
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: nexo-build-${{ github.sha }}
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
